services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable-tensorrt
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "256mb"
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
      # Frigate подставляет в config.yml только переменные с префиксом FRIGATE_
      FRIGATE_CAM_IP: ${CAMERA_IP}
      FRIGATE_CAM_USER: ${CAMERA_USER}
      FRIGATE_CAM_PASSWORD: ${CAMERA_PASSWORD}
    volumes:
      - ./config:/config
      - ./storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "127.0.0.1:5000:5000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
